server:
  port: 8085

spring:
  application:
    name: social-quest-service
  datasource:
    url: jdbc:postgresql://localhost:5432/social_quest_db
    username: ${POSTGRES_USER:farmlife}
    password: ${POSTGRES_PASSWORD:farmlife_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: social_quest
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
    open-in-view: false
  flyway:
    enabled: true
    schemas: social_quest
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: social-quest-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
