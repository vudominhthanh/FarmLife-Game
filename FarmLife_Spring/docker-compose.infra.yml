services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: farmlife-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/01-init-seven-databases.sh:/docker-entrypoint-initdb.d/01-init-seven-databases.sh:ro
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - farmlife-net

  redis:
    image: redis:7.2-alpine
    container_name: farmlife-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - farmlife-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: farmlife-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dual listener: INTERNAL (29092) cho Docker containers, EXTERNAL (9092) cho IntelliJ trên máy Host
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - farmlife-net

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: farmlife-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    networks:
      - farmlife-net

  minio:
    image: quay.io/minio/minio:latest
    container_name: farmlife-minio
    restart: unless-stopped
    env_file: .env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - farmlife-net

  minio-init:
    image: quay.io/minio/minio:latest
    container_name: farmlife-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./infra/minio/lifecycles/temp-expire-7d.json:/etc/minio/temp-expire-7d.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/farmlife-catalog;
      mc mb --ignore-existing local/farmlife-user;
      mc mb --ignore-existing local/farmlife-temp;
      mc version enable local/farmlife-user;
      mc anonymous set download local/farmlife-catalog;
      mc ilm import local/farmlife-temp < /etc/minio/temp-expire-7d.json;
      echo '>>> MinIO 3 buckets & lifecycle rules initialized!';
      "
    networks:
      - farmlife-net

volumes:
  pg_data:
  redis_data:
  minio_data:

networks:
  farmlife-net:
    name: farmlife-net
    driver: bridge